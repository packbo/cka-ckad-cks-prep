apiVersion: v1
kind: Namespace
metadata:
  name: ckad
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: ckad
spec:
  replicas: 3
  selector:
    matchLabels: {app: legacy}
  template:
    metadata:
      labels: {app: legacy}
    spec:
      containers:
      - name: web
        image: nginx:1.21
