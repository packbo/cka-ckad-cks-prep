apiVersion: v1
kind: Namespace
metadata:
  name: rollouts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rollouts
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: nginx:1.21
