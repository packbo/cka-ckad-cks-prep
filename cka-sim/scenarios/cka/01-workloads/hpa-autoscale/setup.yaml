apiVersion: v1
kind: Namespace
metadata:
  name: scale
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: scale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 200m, memory: 256Mi }
