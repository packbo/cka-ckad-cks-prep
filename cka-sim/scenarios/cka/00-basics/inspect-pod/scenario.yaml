id: inspect-pod
title: "LIRE le cluster : get, describe, labels"
domain: basics
weight: 2
difficulty: easy
time_estimate: 240
setup:
  apply: setup.yaml
question: |
  Un Pod `web` existe dans le namespace `basics`.

  1. Trouve son IMAGE (astuce : `kubectl describe pod web -n basics`)
  2. Crée un Pod `twin` dans `basics` avec LA MÊME image
  3. Liste les pods de `basics` AVEC leurs labels

  Tu n'écris aucun YAML : une seule commande pour créer.
hints:
  - level: 1
    text: "Pour lire : kubectl get pods -n basics  et  kubectl describe pod web -n basics  (l'image est dans la section Containers)."
  - level: 2
    text: "Pour créer : kubectl run twin --image=<image trouvée> -n basics . Pour les labels : ajoute --show-labels au get."
  - level: 3
    text: "L'image exacte est nginx:1.21 (pas juste nginx — le tag compte !). Vérifie : kubectl get pods -n basics --show-labels"
  - level: solution
    text: "kubectl describe pod web -n basics | grep Image   puis   kubectl run twin --image=nginx:1.21 -n basics   puis   kubectl get pods -n basics --show-labels"
check:
  assertions:
    - run: "kubectl get pod twin -n basics -o jsonpath='{.spec.containers[0].image}'"
      equals: "nginx:1.21"
    - run: "kubectl get pod twin -n basics -o jsonpath='{.status.phase}'"
      equals: "Running"
