apiVersion: v1
kind: Namespace
metadata:
  name: wait
---
apiVersion: v1
kind: Pod
metadata:
  name: waiter
  namespace: wait
  labels:
    app: waiter
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data-vol   # does not exist -> Pending
