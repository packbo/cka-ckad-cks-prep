id: explain-fields
title: "Découvrir un champ avec kubectl explain (nodeName)"
domain: basics
weight: 3
difficulty: easy
time_estimate: 300
setup:
  apply: setup.yaml
question: |
  Mission : créer le Pod `pinned` (namespace `basics2`, image `nginx:1.21`)
  placé DIRECTEMENT sur le nœud `%WORKER%` — sans scheduler, grâce au
  champ `spec.nodeName`.

  Étapes conseillées (c'est la méthode qui compte) :
  1. `kubectl get nodes` → nom exact du nœud
  2. `kubectl explain pod.spec --recursive | grep -i node` → trouver le champ
  3. `kubectl explain pod.spec.nodeName` → vérifier son type
  4. Générer le YAML (`$do`), ajouter le champ, appliquer
hints:
  - level: 1
    text: "explain fonctionne comme des dossiers : pod → pod.spec → ... Cherche un champ contenant 'node' dans pod.spec."
  - level: 2
    text: "kubectl explain pod.spec --recursive | grep -i node  révèle nodeName (type string). Génère la base : kubectl run pinned --image=nginx:1.21 -n basics2 $do > /tmp/p.yaml"
  - level: 3
    text: "nodeName se place sous spec, au même niveau que containers. Ajoute-le (ex: sed -i '/^spec:/a\\  nodeName: %WORKER%' /tmp/p.yaml) puis kubectl apply -f /tmp/p.yaml"
  - level: solution
    text: "kubectl run pinned --image=nginx:1.21 -n basics2 $do > /tmp/p.yaml && sed -i '/^spec:/a\\  nodeName: %WORKER%' /tmp/p.yaml && kubectl apply -f /tmp/p.yaml && kubectl get pod pinned -n basics2 -o wide"
check:
  assertions:
    - run: "kubectl get pod pinned -n basics2 -o jsonpath='{.spec.nodeName}'"
      equals: "%WORKER%"
    - run: "kubectl get pod pinned -n basics2 -o jsonpath='{.status.phase}'"
      equals: "Running"
