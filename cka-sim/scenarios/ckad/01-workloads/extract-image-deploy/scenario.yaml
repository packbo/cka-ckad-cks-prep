id: extract-image-deploy
title: "Find the configured image of a Deployment"
domain: workloads
weight: 3
difficulty: medium
time_estimate: 180
setup:
  apply: setup.yaml
question: |
  A Deployment named `web` exists in the default namespace.

  Write the image it is configured to run into `/tmp/answer.txt`
  (just the image string, nothing else).
hints:
  - level: 1
    text: "It's a Deployment, so the image is NOT at .spec.containers (that's for Pods). It lives under the pod template."
  - level: 2
    text: "Discover the exact path yourself: kubectl get deploy web -o json | jq -r 'paths(scalars)|join(\".\")' | grep image"
  - level: 3
    text: "Remember JSONPath adds no trailing newline. Use: kubectl get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}'; echo > /tmp/answer.txt   or pipe to jq -r."
  - level: solution
    text: "kubectl get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}' > /tmp/answer.txt"
check:
  assertions:
    - file: /tmp/answer.txt
      contains: "nginx:1.21"
    - run: "kubectl get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}'"
      contains: "nginx:1.21"
