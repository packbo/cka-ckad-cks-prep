id: job-retry-backoff
title: "Job retry policy: backoffLimit and restartPolicy"
domain: workloads
weight: 3
difficulty: medium
time_estimate: 210
setup:
  apply: setup.yaml
question: |
  In namespace `ckad`, create a Job `report` (image `busybox:1.36`,
  command `sh -c "exit 1"`) configured to survive failures:

  - `backoffLimit`: **4**
  - `activeDeadlineSeconds`: **60**
  - pod `restartPolicy`: **Never**

hints:
  - level: 1
    text: "backoffLimit and activeDeadlineSeconds are Job spec fields — kubectl explain job.spec"
  - level: 2
    text: "kubectl create job report -n ckad --image=busybox:1.36 $do > job.yaml, edit spec: backoffLimit, activeDeadlineSeconds, and template.spec.restartPolicy (a Pod-level field inside the Job)."
  - level: 3
    text: "Pitfall: for Jobs the pod restartPolicy must be Never or OnFailure — 'Always' (the Deployment default) is rejected. Verify: kubectl get job report -n ckad -o yaml"
check:
  assertions:
    - run: "kubectl get job report -n ckad -o jsonpath='{.spec.backoffLimit}'"
      equals: "4"
    - run: "kubectl get job report -n ckad -o jsonpath='{.spec.activeDeadlineSeconds}'"
      equals: "60"
    - run: "kubectl get job report -n ckad -o jsonpath='{.spec.template.spec.restartPolicy}'"
      equals: "Never"
