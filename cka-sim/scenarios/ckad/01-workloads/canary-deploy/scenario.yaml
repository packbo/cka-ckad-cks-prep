id: canary-deploy
title: "Canary release: 20% traffic with a second deployment"
domain: workloads
weight: 5
difficulty: hard
time_estimate: 420
setup:
  apply: setup.yaml
question: |
  In namespace `canary`, `frontend-v1` (4 replicas) is live behind service
  `frontend` (selector `app=frontend`).

  Create deployment `frontend-canary` with image `nginx:1.22`, 1 replica,
  pod labels `app=frontend, track=canary`.
  Do not modify `frontend-v1` or the service.
hints:
  - level: 1
    text: "A canary rides the SAME service: its pods must match the Service selector (app=frontend). Inspect: kubectl get deploy frontend-v1 -n canary -o yaml"
  - level: 2
    text: "Generate then edit: kubectl create deploy frontend-canary --image=nginx:1.22 -n canary --dry-run=client -o yaml > canary.yaml ; set template labels app=frontend, track=canary (and selector.matchLabels to match) ; kubectl apply -f canary.yaml"
  - level: 3
    text: "Traffic ratio = replica ratio: 4 v1 + 1 canary = 20% canary. Watch it: kubectl get pods -n canary -l track=canary ; confirm 5 endpoints: kubectl get endpoints frontend -n canary"
  - level: solution
    text: |
      kubectl apply -f - <<EOF
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: frontend-canary, namespace: canary }
      spec:
        replicas: 1
        selector: { matchLabels: { app: frontend, track: canary } }
        template:
          metadata: { labels: { app: frontend, track: canary } }
          spec:
            containers:
            - { name: web, image: "nginx:1.22" }
      EOF
check:
  assertions:
    - run: "kubectl get deploy frontend-canary -n canary -o jsonpath='{.spec.template.spec.containers[0].image}'"
      contains: "nginx:1.22"
    - run: "kubectl get deploy frontend-canary -n canary -o jsonpath='{.spec.template.metadata.labels.app}'"
      equals: "frontend"
    - run: "kubectl get deploy frontend-canary -n canary -o jsonpath='{.status.availableReplicas}'"
      equals: "1"
    - run: "kubectl get deploy frontend-v1 -n canary -o jsonpath='{.status.availableReplicas}'"
      equals: "4"
