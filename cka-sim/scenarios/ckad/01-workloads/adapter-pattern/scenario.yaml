id: adapter-pattern
title: "Multi-container Pod: adapter pattern"
domain: workloads
weight: 3
difficulty: medium
time_estimate: 300
setup:
  apply: setup.yaml
question: |
  In namespace `ckad`, create a Pod named `transformer` implementing the
  ADAPTER pattern:

  - container `app`: image `nginx:1.25`
  - container `adapter`: image `busybox:1.36`, command
    `sh -c "while true; do date >> /var/log/app/processed.log; sleep 10; done"`

  The adapter must write to `/var/log/app/processed.log` on a shared
  `emptyDir` volume named `data`, also mounted at `/var/log/app` in `app`.
hints:
  - level: 1
    text: "Adapter = a second container post-processing the main container's output through a SHARED volume. One Pod, two containers, one emptyDir, two volumeMounts."
  - level: 2
    text: "kubectl run transformer -n ckad --image=nginx:1.25 $do > pod.yaml, then edit: add the adapter container, volumes[0] (emptyDir) and a volumeMounts entry in BOTH containers."
  - level: 3
    text: "Pitfall: each container needs its own volumeMounts entry referencing the SAME volume name data. Apply with kubectl apply -f pod.yaml"
  - level: solution
    text: "Pod yaml with app + adapter containers, volume data (emptyDir) mounted at /var/log/app in both. See kubernetes.io/docs/concepts/workloads/pods/#how-pods-manage multiple containers."
check:
  assertions:
    - run: "kubectl get pod transformer -n ckad -o jsonpath='{.spec.containers[*].name}'"
      contains: "app"
    - run: "kubectl get pod transformer -n ckad -o jsonpath='{.spec.containers[*].name}'"
      contains: "adapter"
    - run: "kubectl get pod transformer -n ckad -o json | jq '.spec.volumes[] | select(.name==\"data\") | has(\"emptyDir\")'"
      contains: "true"
    - run: "kubectl get pod transformer -n ckad -o json | jq '[.spec.containers[] | .volumeMounts[]? | select(.name==\"data\")] | length'"
      contains: "2"
