apiVersion: v1
kind: Namespace
metadata:
  name: bluegreen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: bluegreen
  labels:
    app: bgapp
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bgapp
      version: blue
  template:
    metadata:
      labels:
        app: bgapp
        version: blue
    spec:
      containers:
      - name: web
        image: nginx:1.21
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bg-svc
  namespace: bluegreen
spec:
  selector:
    app: bgapp
    version: blue
  ports:
  - port: 80
    targetPort: 80
