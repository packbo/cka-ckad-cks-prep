id: init-ordering
title: "Init containers: ordered startup"
domain: workloads
weight: 3
difficulty: medium
time_estimate: 240
setup:
  apply: setup.yaml
question: |
  In namespace `ckad`, create a Pod named `pipeline` (image `nginx:1.25`)
  with TWO init containers, in this order:

  1. `setup-config`: image `busybox:1.36`, command
     `sh -c "echo config > /shared/config.txt"`
  2. `wait-db`: image `busybox:1.36`, command
     `sh -c "until nc -z db 5432; do sleep 2; done"`
     (it may fail to resolve — that is fine for this exercise)

  Both init containers and the main container share an `emptyDir` volume
  `shared` mounted at `/shared`. Init containers run sequentially BEFORE
  the main container starts.
hints:
  - level: 1
    text: "initContainers is a separate list next to containers in the Pod spec — kubectl explain pod.spec.initContainers"
  - level: 2
    text: "kubectl run pipeline -n ckad --image=nginx:1.25 $do > pod.yaml, then add spec.initContainers (list, same shape as containers) + the shared emptyDir volume mounted in all three."
  - level: 3
    text: "Pitfall: the ORDER of initContainers is the execution order — setup-config must be FIRST. The main container mounts the same volume name."
check:
  assertions:
    - run: "kubectl get pod pipeline -n ckad -o jsonpath='{.spec.initContainers[0].name}'"
      contains: "setup-config"
    - run: "kubectl get pod pipeline -n ckad -o jsonpath='{.spec.initContainers[1].name}'"
      contains: "wait-db"
    - run: "kubectl get pod pipeline -n ckad -o json | jq '[.spec.initContainers[] | .volumeMounts[]? | select(.name==\"shared\")] | length'"
      contains: "2"
    - run: "kubectl get pod pipeline -n ckad -o json | jq '.spec.containers[0].volumeMounts[]? | select(.name==\"shared\") | .name'"
      contains: "shared"
