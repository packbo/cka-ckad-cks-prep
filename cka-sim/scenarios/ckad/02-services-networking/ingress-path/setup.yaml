apiVersion: v1
kind: Namespace
metadata:
  name: ckad-net
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: ckad-net
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop}
  template:
    metadata:
      labels: {app: shop}
    spec:
      containers:
      - name: web
        image: nginx:1.21
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: ckad-net
spec:
  selector: {app: shop}
  ports:
  - port: 80
    targetPort: 80
