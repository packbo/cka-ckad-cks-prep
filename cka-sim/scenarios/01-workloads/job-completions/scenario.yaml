id: job-completions
title: "Job with completions and parallelism"
domain: workloads
weight: 3
difficulty: easy
time_estimate: 180
setup:
  apply: setup.yaml
question: |
  In namespace `ckad`, create a Job named `migrate`:

  - image `busybox:1.36`, command `echo done`
  - 3 completions, parallelism 2

  Wait until all pods have succeeded.
hints:
  - level: 1
    text: "kubectl create job has flags for both settings; check kubectl create job --help"
  - level: 2
    text: "kubectl create job migrate --image=busybox:1.36 -n ckad -- sh -c 'echo done' $do > job.yaml , edit completions/parallelism, kubectl apply -f job.yaml"
  - level: 3
    text: "Verify completion: kubectl get job migrate -n ckad -w  (COMPLETIONS 3/3). Suspect a stuck pod? kubectl describe pod / logs."
  - level: solution
    text: "kubectl create job migrate --image=busybox:1.36 -n ckad -- sh -c 'echo done' $do > j.yaml && sed -i 's/parallelism: 1/parallelism: 2\\n  completions: 3/' j.yaml && kubectl apply -f j.yaml"
check:
  assertions:
    - run: "kubectl get job migrate -n ckad -o jsonpath='{.spec.completions}'"
      equals: "3"
    - run: "kubectl get job migrate -n ckad -o jsonpath='{.spec.parallelism}'"
      equals: "2"
    - run: "kubectl get job migrate -n ckad -o jsonpath='{.status.succeeded}'"
      equals: "3"
