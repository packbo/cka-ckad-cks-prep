id: security-context
title: "Harden a Pod with securityContext (CKS)"
domain: security
weight: 4
difficulty: medium
time_estimate: 300
setup:
  apply: setup.yaml
question: |
  In namespace `sec`, create Pod `hardened` (image `busybox:1.36`, command `sleep 3600`)
  with container `app` hardened:

  - pod level: `runAsNonRoot: true`, `runAsUser: 1000`
  - container level: `allowPrivilegeEscalation: false`, `readOnlyRootFilesystem: true`,
    capabilities: drop `ALL`
hints:
  - level: 1
    text: "securityContext exists twice in the spec: pod level and container level. kubectl explain pod.spec.securityContext --recursive"
  - level: 2
    text: "runAsNonRoot/runAsUser at pod level; allowPrivilegeEscalation, readOnlyRootFilesystem and capabilities at CONTAINER level. Generate with $do then edit."
  - level: 3
    text: "Pitfall: capabilities is a map {drop: [ALL]}, not a list. busybox as UID 1000 + read-only FS works with plain sleep. Verify: kubectl get pod hardened -n sec -o yaml | grep -A6 securityContext"
  - level: solution
    text: "pod securityContext: {runAsNonRoot: true, runAsUser: 1000} ; container securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}"
check:
  assertions:
    - run: "kubectl get pod hardened -n sec -o jsonpath='{.spec.securityContext.runAsNonRoot}'"
      equals: "true"
    - run: "kubectl get pod hardened -n sec -o jsonpath='{.spec.securityContext.runAsUser}'"
      equals: "1000"
    - run: "kubectl get pod hardened -n sec -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}'"
      equals: "true"
    - run: "kubectl get pod hardened -n sec -o jsonpath='{.spec.containers[0].securityContext.capabilities.drop[0]}'"
      equals: "ALL"
