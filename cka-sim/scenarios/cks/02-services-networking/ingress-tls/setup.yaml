apiVersion: v1
kind: Namespace
metadata:
  name: tlsdemo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: tlsdemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: web
        image: nginx:1.21
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: tlsdemo
spec:
  selector:
    app: app
  ports:
  - port: 80
    targetPort: 80
