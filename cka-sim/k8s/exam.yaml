apiVersion: v1
kind: ServiceAccount
metadata:
  name: cka-exam
---
# Local training cluster only: the exam server runs assertions (kubectl)
# across all namespaces, so it needs broad read/write access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cka-exam-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: cka-exam
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cka-exam
  labels:
    app: cka-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cka-exam
  template:
    metadata:
      labels:
        app: cka-exam
    spec:
      serviceAccountName: cka-exam
      containers:
      - name: web
        image: cka-exam:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cka-exam
spec:
  type: NodePort
  selector:
    app: cka-exam
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30999
